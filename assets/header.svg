<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="meixgan - DevOps Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6A6"/>
      <stop offset="0.5" stop-color="#3AB8FF"/>
      <stop offset="1" stop-color="#8A7DFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="type">
      <rect x="0" y="0" width="0" height="320">
        <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;0.08;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,monospace; }
    .name { font-size: 96px; font-weight: 800; letter-spacing: -2px; animation: rise 1.2s ease-out both; }
    .tag  { font-size: 14px; fill: #8b95a7; letter-spacing: 3px; animation: rise 1.2s .2s ease-out both; }
    .sub  { font-size: 26px; fill: #e6edf3; font-weight: 500; }
    .blob1 { animation: f1 11s ease-in-out infinite alternate; }
    .blob2 { animation: f2 13s ease-in-out infinite alternate; }
    .blob3 { animation: f3 9s ease-in-out infinite alternate; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px);} to { opacity: 1; transform: translateY(0);} }
    @keyframes f1 { to { transform: translate(120px, 40px); } }
    @keyframes f2 { to { transform: translate(-140px, -30px); } }
    @keyframes f3 { to { transform: translate(60px, -50px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1);} 50% { opacity: 1; transform: scale(1.5);} }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <g filter="url(#blur)" opacity="0.55">
      <circle class="blob1" cx="220" cy="90" r="110" fill="#2EE6A6"/>
      <circle class="blob2" cx="980" cy="250" r="130" fill="#8A7DFF"/>
      <circle class="blob3" cx="640" cy="40" r="90" fill="#3AB8FF"/>
    </g>

    <rect width="1200" height="320" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="24"/>

    <!-- status pill -->
    <g transform="translate(80,62)">
      <rect width="230" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle class="dot" cx="20" cy="17" r="4" fill="#2EE6A6"/>
      <text class="mono tag" x="36" y="22" style="font-size:12px;letter-spacing:1.5px">ALL SYSTEMS OPERATIONAL</text>
    </g>

    <text class="mono name" x="76" y="190" fill="url(#accent)">meixgan</text>

    <g clip-path="url(#type)" transform="translate(80,0)">
      <text class="mono sub" x="0" y="244">DevOps Engineer · Cloud · Server Management</text>
    </g>
    <rect class="cursor" x="80" y="224" width="3" height="28" fill="#2EE6A6">
      <animate attributeName="x" values="80;80;780;780;80" keyTimes="0;0.08;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- decorative code window -->
    <g transform="translate(880,70)" opacity="0.95">
      <rect width="250" height="150" rx="14" fill="#0b0f17" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="5" fill="#ff5f56"/><circle cx="38" cy="20" r="5" fill="#ffbd2e"/><circle cx="56" cy="20" r="5" fill="#27c93f"/>
      <g class="mono" font-size="13">
        <text x="20" y="58" fill="#8b95a7">$ <tspan fill="#2EE6A6">deploy</tspan> --prod</text>
        <text x="20" y="82" fill="#8b95a7">build  <tspan fill="#2EE6A6">✓</tspan></text>
        <text x="20" y="104" fill="#8b95a7">test   <tspan fill="#2EE6A6">✓</tspan></text>
        <text x="20" y="126" fill="#8b95a7">ship   <tspan fill="#2EE6A6">✓</tspan></text>
      </g>
    </g>
  </g>
</svg>
